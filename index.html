<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <!-- Balises pour l'application iPhone/iPad (PWA) -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Mon Cycle">
    <link rel="apple-touch-icon" href="https://via.placeholder.com/192/FFC0CB/FFFFFF?text=Cycle">
    
    <title>Mon Cycle 🌸</title>
    <style>
        :root {
            --pink-light: #FDE8ED;
            --pink-medium: #F8C8D4;
            --pink-dark: #E598AB;
            --white: #FFFFFF;
            --text: #5A4A4D;
            --gray-light: #F0F0F0;
        }

        * {
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
            user-select: none; 
            -webkit-user-select: none;
        }

        body {
            background-color: var(--pink-light);
            color: var(--text);
            padding: 20px;
            min-height: 100vh;
            padding-bottom: 40px;
        }

        .container {
            max-width: 500px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 24px;
            font-weight: 600;
            color: var(--pink-dark);
            margin-bottom: 5px;
        }

        .date-display {
            font-size: 14px;
            color: var(--text);
            opacity: 0.8;
            font-weight: 500;
        }

        .card {
            background-color: var(--white);
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(229, 152, 171, 0.15);
            margin-bottom: 20px;
        }

        .card-title {
            font-size: 16px;
            font-weight: 600;
            color: var(--pink-dark);
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        /* Checkbox Pilule */
        .pill-container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 0;
        }

        .pill-text {
            font-size: 16px;
            font-weight: 500;
        }

        .custom-checkbox {
            width: 32px;
            height: 32px;
            border-radius: 10px;
            border: 2px solid var(--pink-medium);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: 0.3s;
            font-size: 18px;
        }

        .custom-checkbox.checked {
            background-color: var(--pink-dark);
            border-color: var(--pink-dark);
            color: var(--white);
        }

        /* Echelle de douleur */
        .slider-container {
            text-align: center;
        }

        .pain-value {
            font-size: 32px;
            font-weight: bold;
            color: var(--pink-dark);
            margin: 10px 0;
            display: block;
        }

        input[type=range] {
            -webkit-appearance: none;
            width: 100%;
            background: transparent;
        }

        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 24px;
            width: 24px;
            border-radius: 50%;
            background: var(--pink-dark);
            cursor: pointer;
            margin-top: -8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }

        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 8px;
            cursor: pointer;
            background: var(--pink-light);
            border-radius: 10px;
        }

        /* Symptômes */
        .symptoms-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .symptom-chip {
            background-color: var(--gray-light);
            color: var(--text);
            padding: 8px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: 0.3s;
        }

        .symptom-chip.active {
            background-color: var(--pink-medium);
            color: var(--white);
        }

        /* Médicaments */
        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        select, input[type="time"] {
            border: 2px solid var(--pink-light);
            border-radius: 12px;
            padding: 10px;
            font-size: 14px;
            outline: none;
            color: var(--text);
            background-color: #FAFAFA;
            flex: 1;
        }

        button.add-btn {
            background-color: var(--pink-medium);
            color: var(--white);
            border: none;
            border-radius: 12px;
            padding: 10px 15px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
        }

        button.add-btn:active {
            background-color: var(--pink-dark);
            transform: scale(0.95);
        }

        .med-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .med-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: var(--pink-light);
            padding: 10px 15px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 500;
        }

        .delete-btn {
            color: #ff6b6b;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
        }
        
        .save-day-btn {
            width: 100%;
            background-color: var(--pink-dark);
            color: white;
            padding: 15px;
            border-radius: 15px;
            border: none;
            font-size: 16px;
            font-weight: 600;
            margin-top: 10px;
        }
        
        .save-day-btn:active {
            opacity: 0.8;
            transform: scale(0.98);
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>Mon Cycle 🌸</h1>
        <div class="date-display" id="currentDate">Date du jour</div>
    </div>

    <!-- Carte Pilule -->
    <div class="card">
        <div class="pill-container" onclick="togglePill()">
            <span class="pill-text">Pilule prise aujourd'hui ?</span>
            <div class="custom-checkbox" id="pillCheckbox"></div>
        </div>
    </div>

    <!-- Carte Douleur -->
    <div class="card">
        <div class="card-title">Niveau de douleur 🩸</div>
        <div class="slider-container">
            <span class="pain-value" id="painDisplay">0</span>
            <input type="range" id="painSlider" min="0" max="10" value="0" oninput="updatePain()">
        </div>
    </div>

    <!-- Carte Symptômes -->
    <div class="card">
        <div class="card-title">Mes symptômes (Règles / Endo)</div>
        <div class="symptoms-grid" id="symptomsContainer">
            <!-- Rempli par le JavaScript -->
        </div>
    </div>

    <!-- Carte Médicaments -->
    <div class="card">
        <div class="card-title">Médicaments pris 💊</div>
        <div class="input-group">
            <select id="medSelect">
                <option value="Antadys">Antadys</option>
                <option value="Spasfon">Spasfon</option>
                <option value="Doliprane">Doliprane</option>
                <option value="Ibuprofène">Ibuprofène</option>
                <option value="Ponstyl">Ponstyl</option>
                <option value="Tramadol">Tramadol</option>
                <option value="Autre">Autre...</option>
            </select>
            <input type="time" id="medTime" required>
            <button class="add-btn" onclick="addMed()">+</button>
        </div>
        <div class="med-list" id="medListContainer">
            <!-- Liste des médicaments pris -->
        </div>
    </div>

    <button class="save-day-btn" onclick="saveDay()">Enregistrer ma journée ✨</button>
</div>

<script>
    // Configuration de base
    const today = new Date().toISOString().split('T')[0];
    const displayDate = new Date().toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long' });
    document.getElementById('currentDate').innerText = displayDate.charAt(0).toUpperCase() + displayDate.slice(1);

    // Liste des symptômes
    const allSymptoms = [
        "Crampes", "Douleur pelvienne", "Fatigue", "Ballonnements", 
        "Maux de tête", "Nausées", "Douleur bas du dos", "Acné", 
        "Sauts d'humeur", "Seins douloureux", "Règles abondantes"
    ];

    // Données du jour
    let dayData = JSON.parse(localStorage.getItem('cycleData_' + today)) || {
        pillTaken: false,
        pain: 0,
        symptoms: [],
        meds: []
    };

    // Initialisation
    initSymptoms();
    loadDayData();

    // --- Fonctions Pilule ---
    function togglePill() {
        dayData.pillTaken = !dayData.pillTaken;
        updatePillUI();
    }

    function updatePillUI() {
        const checkbox = document.getElementById('pillCheckbox');
        if (dayData.pillTaken) {
            checkbox.classList.add('checked');
            checkbox.innerHTML = "✓";
        } else {
            checkbox.classList.remove('checked');
            checkbox.innerHTML = "";
        }
    }

    // --- Fonctions Douleur ---
    function updatePain() {
        const slider = document.getElementById('painSlider');
        document.getElementById('painDisplay').innerText = slider.value;
        dayData.pain = parseInt(slider.value);
    }

    // --- Fonctions Symptômes ---
    function initSymptoms() {
        const container = document.getElementById('symptomsContainer');
        allSymptoms.forEach(sym => {
            const chip = document.createElement('div');
            chip.className = 'symptom-chip';
            chip.innerText = sym;
            chip.onclick = () => toggleSymptom(sym, chip);
            container.appendChild(chip);
        });
    }

    function toggleSymptom(sym, element) {
        if (dayData.symptoms.includes(sym)) {
            dayData.symptoms = dayData.symptoms.filter(s => s !== sym);
            element.classList.remove('active');
        } else {
            dayData.symptoms.push(sym);
            element.classList.add('active');
        }
    }

    // --- Fonctions Médicaments ---
    function addMed() {
        const name = document.getElementById('medSelect').value;
        let time = document.getElementById('medTime').value;
        
        if (!time) {
            const now = new Date();
            time = now.getHours().toString().padStart(2, '0') + ':' + now.getMinutes().toString().padStart(2, '0');
        }

        const newMed = { id: Date.now(), name, time };
        dayData.meds.push(newMed);
        renderMeds();
    }

    function deleteMed(id) {
        dayData.meds = dayData.meds.filter(m => m.id !== id);
        renderMeds();
    }

    function renderMeds() {
        const container = document.getElementById('medListContainer');
        container.innerHTML = '';
        dayData.meds.forEach(med => {
            const div = document.createElement('div');
            div.className = 'med-item';
            div.innerHTML = `
                <span>${med.name} à ${med.time}</span>
                <span class="delete-btn" onclick="deleteMed(${med.id})">×</span>
            `;
            container.appendChild(div);
        });
    }

    // --- Sauvegarde et Chargement ---
    function loadDayData() {
        // Pilule
        updatePillUI();
        
        // Douleur
        document.getElementById('painSlider').value = dayData.pain;
        document.getElementById('painDisplay').innerText = dayData.pain;
        
        // Symptômes (mise à jour visuelle)
        const chips = document.querySelectorAll('.symptom-chip');
        chips.forEach(chip => {
            if (dayData.symptoms.includes(chip.innerText)) {
                chip.classList.add('active');
            }
        });

        // Médicaments
        renderMeds();
    }

    function saveDay() {
        localStorage.setItem('cycleData_' + today, JSON.stringify(dayData));
        alert('Ta journée a été enregistrée avec succès ! 🌸');
    }
</script>

</body>
</html>
