
 
    <!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Mon Cycle">
    <link rel="apple-touch-icon" href="https://via.placeholder.com/192/FFC0CB/FFFFFF?text=Cycle">
    
    <title>Mon Cycle 🌸</title>
    <style>
        :root {
            --pink-light: #FDE8ED;
            --pink-medium: #F8C8D4;
            --pink-dark: #E598AB;
            --white: #FFFFFF;
            --text: #5A4A4D;
            --gray-light: #F0F0F0;
        }

        * {
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
            user-select: none; 
            -webkit-user-select: none;
        }

        body {
            background-color: var(--pink-light);
            color: var(--text);
            padding: 20px;
            min-height: 100vh;
            padding-bottom: 40px;
        }

        .container {
            max-width: 500px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 24px;
            font-weight: 600;
            color: var(--pink-dark);
            margin-bottom: 5px;
        }

        .date-display {
            font-size: 14px;
            color: var(--text);
            opacity: 0.8;
            font-weight: 500;
        }

        .card {
            background-color: var(--white);
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(229, 152, 171, 0.15);
            margin-bottom: 20px;
        }

        .card-title {
            font-size: 16px;
            font-weight: 600;
            color: var(--pink-dark);
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        /* --- Calendrier --- */
        .calendar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            font-weight: 600;
            color: var(--pink-dark);
        }
        .calendar-header button {
            background: none;
            border: none;
            font-size: 20px;
            color: var(--pink-dark);
            padding: 5px 15px;
            cursor: pointer;
        }
        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 5px;
            text-align: center;
        }
        .day-name {
            font-size: 12px;
            font-weight: 600;
            color: var(--pink-medium);
            margin-bottom: 5px;
        }
        .calendar-day {
            padding: 10px 5px;
            border-radius: 12px;
            font-size: 14px;
            cursor: pointer;
            transition: 0.2s;
            position: relative;
        }
        .calendar-day:hover, .calendar-day.selected {
            background-color: var(--pink-light);
            font-weight: bold;
        }
        .calendar-day.period-day {
            background-color: var(--pink-medium);
            color: var(--white);
        }
        .calendar-day.rdv-day::after {
            content: "•";
            color: var(--pink-dark);
            position: absolute;
            bottom: -2px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 18px;
        }
        .event-input-area {
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid var(--pink-light);
            display: none;
        }
        
        /* Checkbox Pilule */
        .pill-container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 0;
        }
        .pill-text { font-size: 16px; font-weight: 500; }
        .custom-checkbox {
            width: 32px;
            height: 32px;
            border-radius: 10px;
            border: 2px solid var(--pink-medium);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: 0.3s;
            font-size: 18px;
        }
        .custom-checkbox.checked {
            background-color: var(--pink-dark);
            border-color: var(--pink-dark);
            color: var(--white);
        }

        /* Douleur & Conseil */
        .slider-container { text-align: center; }
        .pain-value {
            font-size: 32px;
            font-weight: bold;
            color: var(--pink-dark);
            margin: 10px 0;
            display: block;
        }
        input[type=range] {
            -webkit-appearance: none;
            width: 100%;
            background: transparent;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 24px;
            width: 24px;
            border-radius: 50%;
            background: var(--pink-dark);
            cursor: pointer;
            margin-top: -8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 8px;
            background: var(--pink-light);
            border-radius: 10px;
        }
        .advice-box {
            background-color: #FFF0F3;
            border-left: 4px solid var(--pink-dark);
            padding: 12px;
            border-radius: 8px;
            margin-top: 15px;
            font-size: 14px;
            display: none;
            line-height: 1.4;
        }

        /* Symptômes & Médicaments */
        .symptoms-grid { display: flex; flex-wrap: wrap; gap: 10px; }
        .symptom-chip {
            background-color: var(--gray-light);
            color: var(--text);
            padding: 8px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: 0.3s;
        }
        .symptom-chip.active {
            background-color: var(--pink-medium);
            color: var(--white);
        }

        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
        }
        select, input[type="time"], input[type="text"] {
            border: 2px solid var(--pink-light);
            border-radius: 12px;
            padding: 10px;
            font-size: 14px;
            outline: none;
            color: var(--text);
            background-color: #FAFAFA;
            flex: 1;
            width: 100%;
        }
        button.action-btn {
            background-color: var(--pink-medium);
            color: var(--white);
            border: none;
            border-radius: 12px;
            padding: 10px 15px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
        }
        button.action-btn:active { background-color: var(--pink-dark); transform: scale(0.95); }

        .list-container { display: flex; flex-direction: column; gap: 10px; }
        .list-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: var(--pink-light);
            padding: 10px 15px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 500;
        }
        .delete-btn { color: #ff6b6b; font-weight: bold; font-size: 16px; cursor: pointer; }
        
        .save-day-btn {
            width: 100%;
            background-color: var(--pink-dark);
            color: white;
            padding: 15px;
            border-radius: 15px;
            border: none;
            font-size: 16px;
            font-weight: 600;
            margin-top: 10px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>Mon Cycle 🌸</h1>
        <div class="date-display" id="currentDate">Date du jour</div>
    </div>

    <!-- NOUVEAU: Calendrier -->
    <div class="card">
        <div class="card-title">Calendrier 📅</div>
        <div class="calendar-header">
            <button onclick="changeMonth(-1)">‹</button>
            <span id="monthYearDisplay"></span>
            <button onclick="changeMonth(1)">›</button>
        </div>
        <div class="calendar-grid" id="calendarGrid">
            <!-- Jours générés par JS -->
        </div>
        
        <!-- Zone d'ajout d'événement sous le calendrier -->
        <div class="event-input-area" id="eventArea">
            <div style="font-weight: 600; color: var(--pink-dark); margin-bottom: 10px;" id="selectedDateText"></div>
            <div class="input-group">
                <select id="eventType">
                    <option value="Règles">🩸 Période de Règles</option>
                    <option value="RDV Gynéco">👩‍⚕️ RDV Gynéco</option>
                    <option value="Note">📝 Autre note</option>
                </select>
            </div>
            <div class="input-group">
                <input type="text" id="eventNote" placeholder="Détails (ex: rdv 14h, douleurs...)">
                <button class="action-btn" onclick="addEvent()">+</button>
            </div>
            <div class="list-container" id="eventListContainer"></div>
        </div>
    </div>

    <!-- Pilule -->
    <div class="card">
        <div class="pill-container" onclick="togglePill()">
            <span class="pill-text">Pilule prise aujourd'hui ?</span>
            <div class="custom-checkbox" id="pillCheckbox"></div>
        </div>
    </div>

    <!-- Douleur -->
    <div class="card">
        <div class="card-title">Niveau de douleur 🩸</div>
        <div class="slider-container">
            <span class="pain-value" id="painDisplay">0</span>
            <input type="range" id="painSlider" min="0" max="10" value="0" oninput="updatePain()">
        </div>
        <!-- NOUVEAU: Boîte à conseils -->
        <div class="advice-box" id="painAdvice"></div>
    </div>

    <!-- Symptômes -->
    <div class="card">
        <div class="card-title">Mes symptômes</div>
        <div class="symptoms-grid" id="symptomsContainer"></div>
    </div>

    <!-- Médicaments -->
    <div class="card">
        <div class="card-title">Médicaments pris 💊</div>
        <div class="input-group">
            <select id="medSelect">
                <option value="Antadys">Antadys</option>
                <option value="Spasfon">Spasfon</option>
                <option value="Doliprane">Doliprane</option>
                <option value="Ibuprofène">Ibuprofène</option>
                <option value="Ponstyl">Ponstyl</option>
                <option value="Autre">Autre...</option>
            </select>
            <input type="time" id="medTime">
            <button class="action-btn" onclick="addMed()">+</button>
        </div>
        <div class="list-container" id="medListContainer"></div>
    </div>

    <button class="save-day-btn" onclick="saveDay()">Enregistrer ma journée ✨</button>
</div>

<script>
    // --- Variables de base ---
    const todayStr = new Date().toISOString().split('T')[0];
    const displayDate = new Date().toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long' });
    document.getElementById('currentDate').innerText = displayDate.charAt(0).toUpperCase() + displayDate.slice(1);

    const allSymptoms = ["Crampes", "Douleur pelvienne", "Fatigue", "Ballonnements", "Maux de tête", "Nausées", "Douleur bas du dos", "Acné", "Sauts d'humeur", "Seins douloureux", "Règles abondantes"];

    let dayData = JSON.parse(localStorage.getItem('cycleData_' + todayStr)) || { pillTaken: false, pain: 0, symptoms: [], meds: [] };
    let calendarEvents = JSON.parse(localStorage.getItem('cycleCalendar')) || {};

    let currentNavDate = new Date();
    let selectedDateStr = null;

    // --- Initialisation ---
    initSymptoms();
    loadDayData();
    renderCalendar();

    // --- Calendrier ---
    function renderCalendar() {
        const monthYear = currentNavDate.toLocaleDateString('fr-FR', { month: 'long', year: 'numeric' });
        document.getElementById('monthYearDisplay').innerText = monthYear.charAt(0).toUpperCase() + monthYear.slice(1);
        
        const grid = document.getElementById('calendarGrid');
        grid.innerHTML = '<div class="day-name">L</div><div class="day-name">M</div><div class="day-name">M</div><div class="day-name">J</div><div class="day-name">V</div><div class="day-name">S</div><div class="day-name">D</div>';
        
        const year = currentNavDate.getFullYear();
        const month = currentNavDate.getMonth();
        const firstDay = new Date(year, month, 1).getDay();
        const daysInMonth = new Date(year, month + 1, 0).getDate();
        
        // Ajuster pour que la semaine commence le lundi (1)
        let emptyDays = firstDay === 0 ? 6 : firstDay - 1;
        for (let i = 0; i < emptyDays; i++) {
            grid.innerHTML += '<div></div>';
        }

        for (let i = 1; i <= daysInMonth; i++) {
            const dateStr = `${year}-${String(month+1).padStart(2,'0')}-${String(i).padStart(2,'0')}`;
            let classes = 'calendar-day';
            
            if (calendarEvents[dateStr]) {
                const events = calendarEvents[dateStr];
                if (events.some(e => e.type === 'Règles')) classes += ' period-day';
                if (events.some(e => e.type === 'RDV Gynéco')) classes += ' rdv-day';
            }
            if (dateStr === selectedDateStr) classes += ' selected';
            if (dateStr === todayStr) classes += ' today'; // Optionnel pour marquer aujourd'hui

            grid.innerHTML += `<div class="${classes}" onclick="selectDate('${dateStr}', ${i})">${i}</div>`;
        }
    }

    function changeMonth(direction) {
        currentNavDate.setMonth(currentNavDate.getMonth() + direction);
        document.getElementById('eventArea').style.display = 'none';
        selectedDateStr = null;
        renderCalendar();
    }

    function selectDate(dateStr, dayNum) {
        selectedDateStr = dateStr;
        document.getElementById('eventArea').style.display = 'block';
        
        const prettyDate = new Date(dateStr).toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long' });
        document.getElementById('selectedDateText').innerText = "Ajouter pour le " + prettyDate;
        
        renderEventsForSelectedDate();
        renderCalendar(); // Met à jour la sélection visuelle
    }

    function addEvent() {
        if (!selectedDateStr) return;
        const type = document.getElementById('eventType').value;
        const note = document.getElementById('eventNote').value;
        
        if (!calendarEvents[selectedDateStr]) calendarEvents[selectedDateStr] = [];
        calendarEvents[selectedDateStr].push({ id: Date.now(), type, note });
        
        localStorage.setItem('cycleCalendar', JSON.stringify(calendarEvents));
        document.getElementById('eventNote').value = '';
        
        renderEventsForSelectedDate();
        renderCalendar(); // Rafraîchit les couleurs du calendrier
    }

    function renderEventsForSelectedDate() {
        const container = document.getElementById('eventListContainer');
        container.innerHTML = '';
        if (calendarEvents[selectedDateStr]) {
            calendarEvents[selectedDateStr].forEach(ev => {
                const div = document.createElement('div');
                div.className = 'list-item';
                div.innerHTML = `<span><b>${ev.type}</b>: ${ev.note}</span><span class="delete-btn" onclick="deleteEvent(${ev.id})">×</span>`;
                container.appendChild(div);
            });
        }
    }

    function deleteEvent(id) {
        calendarEvents[selectedDateStr] = calendarEvents[selectedDateStr].filter(ev => ev.id !== id);
        if (calendarEvents[selectedDateStr].length === 0) delete calendarEvents[selectedDateStr];
        localStorage.setItem('cycleCalendar', JSON.stringify(calendarEvents));
        renderEventsForSelectedDate();
        renderCalendar();
    }

    // --- Pilule ---
    function togglePill() {
        dayData.pillTaken = !dayData.pillTaken;
        updatePillUI();
    }
    function updatePillUI() {
        const checkbox = document.getElementById('pillCheckbox');
        if (dayData.pillTaken) {
            checkbox.classList.add('checked');
            checkbox.innerHTML = "✓";
        } else {
            checkbox.classList.remove('checked');
            checkbox.innerHTML = "";
        }
    }

    // --- Douleur & Conseils ---
    function updatePain() {
        const slider = document.getElementById('painSlider');
        const val = parseInt(slider.value);
        document.getElementById('painDisplay').innerText = val;
        dayData.pain = val;

        const adviceBox = document.getElementById('painAdvice');
        if (val >= 8) {
            adviceBox.style.display = 'block';
            adviceBox.innerHTML = "Ouch... 🥺 Ta douleur est intense. Mets vite une <b>bouillotte bien chaude</b> sur ton ventre, prends ton anti-douleur, et surtout repose-toi au maximum !";
        } else if (val >= 5) {
            adviceBox.style.display = 'block';
            adviceBox.innerHTML = "Aïe, ça commence à tirer. 🌸 Une <b>tisane réconfortante</b> et un petit massage du bas du dos te feraient du bien.";
        } else if (val >= 1) {
            adviceBox.style.display = 'block';
            adviceBox.innerHTML = "Petite gêne aujourd'hui. Hydrate-toi bien et écoute ton corps ! ✨";
        } else {
            adviceBox.style.display = 'none';
        }
    }

    // --- Symptômes ---
    function initSymptoms() {
        const container = document.getElementById('symptomsContainer');
        allSymptoms.forEach(sym => {
            const chip = document.createElement('div');
            chip.className = 'symptom-chip';
            chip.innerText = sym;
            chip.onclick = () => toggleSymptom(sym, chip);
            container.appendChild(chip);
        });
    }
    function toggleSymptom(sym, element) {
        if (dayData.symptoms.includes(sym)) {
            dayData.symptoms = dayData.symptoms.filter(s => s !== sym);
            element.classList.remove('active');
        } else {
            dayData.symptoms.push(sym);
            element.classList.add('active');
        }
    }

    // --- Médicaments ---
    function addMed() {
        const name = document.getElementById('medSelect').value;
        let time = document.getElementById('medTime').value;
        if (!time) {
            const now = new Date();
            time = now.getHours().toString().padStart(2, '0') + ':' + now.getMinutes().toString().padStart(2, '0');
        }
        dayData.meds.push({ id: Date.now(), name, time });
        renderMeds();
    }
    function deleteMed(id) {
        dayData.meds = dayData.meds.filter(m => m.id !== id);
        renderMeds();
    }
    function renderMeds() {
        const container = document.getElementById('medListContainer');
        container.innerHTML = '';
        dayData.meds.forEach(med => {
            const div = document.createElement('div');
            div.className = 'list-item';
            div.innerHTML = `<span>${med.name} à ${med.time}</span><span class="delete-btn" onclick="deleteMed(${med.id})">×</span>`;
            container.appendChild(div);
        });
    }

    // --- Sauvegarde globale ---
    function loadDayData() {
        updatePillUI();
        document.getElementById('painSlider').value = dayData.pain;
        updatePain(); // Pour afficher le conseil si besoin
        
        const chips = document.querySelectorAll('.symptom-chip');
        chips.forEach(chip => {
            if (dayData.symptoms.includes(chip.innerText)) chip.classList.add('active');
        });
        renderMeds();
    }
    function saveDay() {
        localStorage.setItem('cycleData_' + todayStr, JSON.stringify(dayData));
        alert('Ta journée a été enregistrée avec succès ! 🌸');
    }
</script>

</body>
</html>
